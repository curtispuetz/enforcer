[package]
name = "enforcer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cargo-enforcer"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full"] }
glob = "0.3"
strum = { version = "0.28", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
