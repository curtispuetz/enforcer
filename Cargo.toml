[package]
name = "enforcer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A cargo subcommand that enforces structural rules on a Rust codebase: module tree shape, import direction, file sizes, cognitive complexity, duplication, and more"
license = "MIT"
repository = "https://github.com/curtispuetz/rust-enforcer"
readme = "README.md"
keywords = ["lint", "architecture", "cargo-subcommand", "static-analysis"]
categories = ["development-tools::cargo-plugins", "development-tools"]
exclude = [
    "/tasks",
    "/.claude",
    "/.vscode",
    "CLAUDE.md",
    "agent.xml",
    "architecture.xml",
]

[[bin]]
name = "cargo-enforcer"
path = "src/main.rs"

[dependencies]
syn = { version = "3", features = ["full", "visit", "visit-mut", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
glob = "0.3"
strum = { version = "0.28", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
colored = "3"
